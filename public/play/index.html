<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0b08">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="Fatal Shooter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Robot Fatal Shooter</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0b08; overflow: hidden; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #0d0b08; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #f3ead9; font: 600 15px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
  #load h1 { margin: 0; font-size: clamp(22px, 5vw, 40px); letter-spacing: .04em; }
  #bar { width: min(70vw, 420px); height: 6px; background: #2b241a; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #2f7bff, #ff3324); transition: width .2s; }
  #pct { color: #a39781; font-size: 13px; }
  #rot { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #0d0b08ee; color: #ffd91a; font: 700 18px/1.4 "Segoe UI", system-ui, sans-serif; z-index: 10; }
  @media (orientation: portrait) { body.mobile #rot { display: flex; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><h1>ROBOT FATAL SHOOTER</h1><div id="bar"><div id="fill"></div></div><div id="pct">carregando 0%</div></div>
<div id="rot">Gire o celular para jogar deitado</div>
<script>
  var mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  if (mobile) document.body.classList.add('mobile');
  var canvas = document.getElementById('c');
  var config = {
    dataUrl: "Build/play.data.unityweb?v=d718fb29",
    frameworkUrl: "Build/play.framework.js.unityweb?v=d718fb29",
    codeUrl: "Build/play.wasm.unityweb?v=d718fb29",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "Robot Fatal Shooter",
    productVersion: "1.0",
    // Celular: 1 pixel de tela por pixel de jogo (telas 3x custariam 9 vezes mais por quadro).
    devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5),
    showBanner: function (msg, type) { if (type === 'error') console.error(msg); }
  };
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // Primeiro toque: tela cheia e trava deitado (some a barra do navegador no Android).
  if (mobile) {
    var goFull = function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req && !document.fullscreenElement) {
        try {
          var p = req.call(el, { navigationUI: 'hide' });
          if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
        } catch (e) {}
      }
    };
    document.addEventListener('touchend', goFull, { passive: true });
  }
  var s = document.createElement('script');
  s.src = "Build/play.loader.js?v=d718fb29";
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById('fill').style.width = (100 * p) + '%';
      document.getElementById('pct').textContent = 'carregando ' + Math.round(100 * p) + '%';
    }).then(function () {
      document.getElementById('load').style.display = 'none';
    }).catch(function (m) {
      document.getElementById('pct').textContent = 'erro: ' + m;
    });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
