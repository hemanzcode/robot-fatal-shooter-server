<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08060f">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/fatal-shooter-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/fatal-shooter-180.png">
<meta name="apple-mobile-web-app-title" content="Fatal Shooter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fatal Shooter</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #08060f; overflow: hidden; overscroll-behavior: none; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; outline: none; background: #08060f; }
  #load { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #f5f0ff; font: 600 15px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; background:radial-gradient(ellipse at 50% 35%, #221034, #08060f 70%); }
  #game-logo { display:block; width:clamp(112px, 24vw, 196px); height:auto; border-radius:24px; box-shadow:0 20px 64px #8500ff35; }
  #load h1 { margin: 0; font-size: clamp(14px, 3vw, 20px); letter-spacing: .16em; }
  #bar { width: min(70vw, 420px); height: 6px; background: #2a2034; border-radius:6px; overflow:hidden; }
  #fill { width: 0; height: 100%; background: linear-gradient(90deg, #f5f0ff, #8f15ff); transition: width .2s; }
  #pct { color: #b2a4c3; font-size: 13px; }
  .pwa-install { padding:10px 16px; border:1px solid #9b3de0; border-radius:999px; background:#21112d; color:#f7ebff; font:700 13px/1.2 "Segoe UI",system-ui,sans-serif; letter-spacing:.04em; cursor:pointer; }
  .pwa-install-hint { max-width:min(90vw,420px); margin:0; color:#c8bbd6; font:500 12px/1.4 "Segoe UI",system-ui,sans-serif; letter-spacing:0; text-align:center; text-transform:none; }
  [hidden] { display:none !important; }
  #rot { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: #08060fee; color: #d8b8ff; font: 700 18px/1.4 "Segoe UI", system-ui, sans-serif; z-index: 10; }
  @media (orientation: portrait) { body.mobile #rot { display: flex; } }
</style>
</head>
<body>
<canvas id="c" tabindex="-1"></canvas>
<div id="load"><img id="game-logo" src="/icons/logo-fatal-shooter.jpeg" alt="Logo Fatal Shooter" width="196" height="196"><h1>CARREGANDO JOGO</h1><div id="bar"><div id="fill"></div></div><div id="pct">carregando 0%</div><button id="install-app" class="pwa-install" data-pwa-install hidden type="button">INSTALAR JOGO</button><p id="install-hint" class="pwa-install-hint" data-pwa-install-hint aria-live="polite"></p></div>
<div id="rot">Gire o celular para jogar deitado</div>
<script src="/pwa-install.js" defer></script>
<script>
  var mobile = /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
  if (mobile) document.body.classList.add('mobile');
  var canvas = document.getElementById('c');
  var config = {
    dataUrl: "Build/play.data.unityweb?v=7f0d0857",
    frameworkUrl: "Build/play.framework.js.unityweb?v=7f0d0857",
    codeUrl: "Build/play.wasm.unityweb?v=7f0d0857",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "DefaultCompany",
    productName: "Fatal Shooter",
    productVersion: "1.0",
    // Celular: 1 pixel de tela por pixel de jogo (telas 3x custariam 9 vezes mais por quadro).
    devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5),
    showBanner: function (msg, type) { if (type === 'error') console.error(msg); }
  };
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  // PC: CTRL e so para agachar. Bloqueia os atalhos do navegador (CTRL+S, D, F, A, roda = zoom...) enquanto joga;
  // em tela cheia o "keyboard lock" segura ate CTRL+W/T/N (que o navegador nao deixa bloquear fora dela).
  if (!mobile) {
    window.addEventListener('keydown', function (e) { if (e.ctrlKey || e.key === 'Control') e.preventDefault(); }, true);
    window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, { passive: false, capture: true });
    var lockKeys = function () { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock().catch(function () {}); };
    document.addEventListener('fullscreenchange', function () { if (document.fullscreenElement) lockKeys(); });
    canvas.addEventListener('mousedown', function () {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen)
        document.documentElement.requestFullscreen().then(lockKeys).catch(function () {});
    });
    // Se mesmo assim o navegador tentar fechar a aba (CTRL+W fora da tela cheia), pergunta antes.
    window.addEventListener('beforeunload', function (e) { if (window.rfsQuit) return; e.preventDefault(); e.returnValue = ''; });
  }
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // Primeiro toque: tela cheia e trava deitado (some a barra do navegador no Android).
  if (mobile) {
    var goFull = function () {
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (req && !document.fullscreenElement) {
        try {
          var p = req.call(el, { navigationUI: 'hide' });
          if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {});
        } catch (e) {}
      }
    };
    document.addEventListener('touchend', goFull, { passive: true });
  }
  var s = document.createElement('script');
  s.src = "Build/play.loader.js";
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      document.getElementById('fill').style.width = (100 * p) + '%';
      document.getElementById('pct').textContent = 'carregando ' + Math.round(100 * p) + '%';
    }).then(function () {
      document.getElementById('load').style.display = 'none';
    }).catch(function (m) {
      document.getElementById('pct').textContent = 'erro: ' + m;
    });
  };
  document.body.appendChild(s);
</script>
</body>
</html>
