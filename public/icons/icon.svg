<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/><stop offset="1" stop-color="#0a0b0f"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a90ff"/><stop offset="1" stop-color="#1c52c9"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4a3d"/><stop offset="1" stop-color="#b8160d"/>
    </linearGradient>
    <clipPath id="L"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="R"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- raios de fundo -->
  <g opacity="0.12" stroke="#ffd21a" stroke-width="6">
    <line x1="256" y1="256" x2="0" y2="40"/><line x1="256" y1="256" x2="512" y2="40"/>
    <line x1="256" y1="256" x2="0" y2="470"/><line x1="256" y1="256" x2="512" y2="470"/>
  </g>
  <!-- antenas -->
  <rect x="150" y="70" width="14" height="60" rx="5" fill="#4a90ff"/><circle cx="157" cy="66" r="14" fill="#4a90ff"/>
  <rect x="348" y="70" width="14" height="60" rx="5" fill="#ff4a3d"/><circle cx="355" cy="66" r="14" fill="#ff4a3d"/>
  <!-- cabeca: metade azul / metade vermelha -->
  <g clip-path="url(#L)"><rect x="96" y="118" width="320" height="270" rx="56" fill="url(#blue)"/></g>
  <g clip-path="url(#R)"><rect x="96" y="118" width="320" height="270" rx="56" fill="url(#red)"/></g>
  <rect x="252" y="118" width="8" height="270" fill="#0a0b0f" opacity="0.55"/>
  <!-- visor -->
  <rect x="132" y="180" width="248" height="104" rx="34" fill="#0b0d12"/>
  <rect x="150" y="214" width="66" height="36" rx="14" fill="#ffd21a"/>
  <rect x="296" y="214" width="66" height="36" rx="14" fill="#ffd21a"/>
  <!-- boca -->
  <g fill="#0b0d12"><rect x="186" y="314" width="22" height="34" rx="5"/><rect x="222" y="314" width="22" height="34" rx="5"/><rect x="268" y="314" width="22" height="34" rx="5"/><rect x="304" y="314" width="22" height="34" rx="5"/></g>
  <!-- mira -->
  <g stroke="#ffd21a" stroke-width="16" fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="196" stroke-width="14" opacity="0.95"/>
    <line x1="256" y1="30" x2="256" y2="92"/><line x1="256" y1="420" x2="256" y2="482"/>
    <line x1="30" y1="256" x2="78" y2="256"/><line x1="434" y1="256" x2="482" y2="256"/>
  </g>
  <!-- nome -->
  <rect x="96" y="410" width="320" height="58" rx="12" fill="#0b0d12" opacity="0.9"/>
  <text x="256" y="452" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold" font-size="36" letter-spacing="3" fill="#ffd21a">FATAL SHOOTER</text>
</svg>
